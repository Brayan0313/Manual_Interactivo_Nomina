# ============================================================
# CONFIGURACIÓN DEL EDITOR (versión simplificada)
# Dos secciones: "Procesos del manual" y "Pasos que se repiten"
# ============================================================

backend:
  name: github
  repo: Brayan0313/Manual_Interactivo_Nomina   # usuario/repositorio
  branch: main

locale: es

# Dónde se guardan las imágenes que suban desde el editor
media_folder: "img"
public_folder: "img"

collections:

  # ---------------------------------------------------------
  # SECCIÓN 1: PROCESOS
  # ---------------------------------------------------------
  - name: procesos
    label: "Procesos del manual"
    files:
      - name: procesos
        label: "Lista de procesos"
        file: "datos/procesos.json"
        fields:
          - label: "Procesos"
            name: procesos
            widget: list
            label_singular: "proceso"
            summary: "{{fields.nombre}}"
            collapsed: true
            fields:
              - { label: "Nombre del proceso", name: nombre, widget: string, hint: "Como se verá en el menú del manual." }
              - { label: "Descripción corta", name: resumen, widget: text, hint: "Una o dos frases que se ven debajo del nombre." }
              - label: "Pertenece al proceso (solo si es un subproceso)"
                name: padre
                widget: relation
                collection: procesos
                file: procesos
                search_fields: ["procesos.*.nombre"]
                value_field: "procesos.*.id"
                display_fields: ["procesos.*.nombre"]
                required: false
                hint: "Déjelo vacío si es un proceso principal."
              - label: "Pasos del proceso"
                name: pasos
                widget: list
                label_singular: "paso"
                summary: "{{fields.titulo}}{{fields.bloque}}"
                collapsed: true
                hint: "Use + para agregar un paso. En cada paso escriba el título y el texto, O elija un paso que se repite (no ambos)."
                fields:
                  - { label: "Título del paso", name: titulo, widget: string, required: false }
                  - { label: "Qué se hace en este paso", name: texto, widget: text, required: false }
                  - { label: "Captura de pantalla (opcional)", name: imagen, widget: image, required: false }
                  - label: "O elija un paso que se repite"
                    name: bloque
                    widget: relation
                    collection: bloques
                    file: bloques
                    search_fields: ["bloques.*.titulo"]
                    value_field: "bloques.*.id"
                    display_fields: ["bloques.*.titulo"]
                    required: false
                    hint: "Si elige uno, no hace falta escribir título ni texto."
                  - label: "Datos que cambian en ese paso (opcional)"
                    name: params
                    widget: list
                    label_singular: "dato"
                    required: false
                    collapsed: false
                    hint: "Solo si el paso repetido tiene datos entre llaves {así}. Ejemplo: Nombre = concepto, Valor = 158."
                    fields:
                      - { label: "Nombre del dato", name: nombre, widget: string }
                      - { label: "Valor", name: valor, widget: string }
              - { label: "Código del proceso (no cambiar)", name: id, widget: string, hint: "Uso interno. Minúsculas, sin espacios ni tildes, con guiones. No lo modifique en procesos que ya existen." }

  # ---------------------------------------------------------
  # SECCIÓN 2: PASOS QUE SE REPITEN (BLOQUES)
  # ---------------------------------------------------------
  - name: bloques
    label: "Pasos que se repiten"
    files:
      - name: bloques
        label: "Lista de pasos que se repiten"
        file: "datos/bloques.json"
        fields:
          - label: "Pasos que se repiten"
            name: bloques
            widget: list
            label_singular: "paso que se repite"
            summary: "{{fields.titulo}}"
            collapsed: true
            hint: "Se escriben una sola vez y se usan en varios procesos. Para un dato que cambia use {nombre}."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Captura de pantalla (opcional)", name: imagen, widget: image, required: false }
              - { label: "Código (no cambiar)", name: id, widget: string, hint: "Uso interno. Sin espacios ni tildes. No lo modifique en pasos que ya existen." }
