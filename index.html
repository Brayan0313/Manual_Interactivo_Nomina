<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual de procesos</title>
<style>
  /* ===== COLORES: azul oscuro, rojo y gris ===== */
  :root {
    --fondo: #eceff3; --tarjeta: #ffffff; --texto: #1a2433; --suave: #5d6a7c;
    --linea: #d2d8e0; --acento: #14275a; --acento-texto: #ffffff;
    --titulo: #14275a; --rojo: #c8102e;
    --param-fondo: #fde7ea; --param-texto: #9b0c22;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #0b1424; --tarjeta: #14203a; --texto: #e7ecf4; --suave: #9ba8bc;
      --linea: #263451; --acento: #3d65c9; --acento-texto: #ffffff;
      --titulo: #dbe5ff; --rojo: #ff5c72;
      --param-fondo: #4a1822; --param-texto: #ffb3be;
    }
  }
  body { margin: 0; background: var(--fondo); color: var(--texto); border-top: 6px solid var(--rojo);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 18px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 8px 0 6px; color: var(--titulo); }
  h2 { font-size: 1.35rem; margin: 0 0 4px; color: var(--titulo); }
  p.sub { color: var(--suave); margin: 0 0 20px; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  /* ===== MENÚ ===== */
  #buscador { width: 100%; box-sizing: border-box; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--tarjeta); border: 1.5px solid var(--linea); border-radius: 10px; margin-bottom: 14px; }
  .lista { display: grid; gap: 10px; }
  .proceso { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
    background: var(--tarjeta); border: 1.5px solid var(--linea); border-radius: 10px; padding: 14px 16px; }
  .proceso:hover { border-color: var(--rojo); }
  .proceso strong { display: block; color: var(--titulo); }
  .proceso span { color: var(--suave); font-size: .92rem; }
  .vacio { color: var(--suave); padding: 12px 2px; }
  .areas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 8px; }
  .area { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--tarjeta);
    border: 1.5px solid var(--linea); border-top: 5px solid var(--acento); border-radius: 12px; padding: 22px 20px; }
  .area:hover { border-top-color: var(--rojo); border-color: var(--rojo); }
  .area strong { display: block; font-size: 1.3rem; color: var(--titulo); }
  .area span { color: var(--suave); }
  .btn-admin { position: fixed; top: 14px; right: 14px; z-index: 20; font: inherit; font-size: .82rem; cursor: pointer;
    background: var(--tarjeta); color: var(--suave); border: 1.5px solid var(--linea); border-radius: 999px; padding: 5px 12px; }
  .btn-admin:hover { color: var(--titulo); border-color: var(--acento); }
  .etq-b { font-size: .7rem; font-weight: 700; background: #6b7280; color: #fff; border-radius: 5px; padding: 1px 7px; vertical-align: middle; }
  [hidden] { display: none !important; }
  .frag { display: block; margin-top: 5px; font-size: .88rem; color: var(--texto); }
  .frag b { color: var(--rojo); }
  mark { background: #ffe38a; color: #1a2433; border-radius: 3px; padding: 0 2px; }
  .etq-a { font-size: .72rem; font-weight: 600; background: var(--linea); color: var(--suave); border-radius: 5px; padding: 1px 7px; vertical-align: middle; }
  .pie { margin-top: 36px; text-align: center; }
  .pie button { background: none; border: 0; color: var(--suave); font: inherit; font-size: .85rem; cursor: pointer; text-decoration: underline; }

  /* ===== PASO A PASO ===== */
  .volver { background: none; border: 0; color: var(--rojo); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
  ol.pasos { list-style: none; counter-reset: p; padding: 0; margin: 20px 0 0; }
  ol.pasos > li { counter-increment: p; position: relative; background: var(--tarjeta);
    border: 1.5px solid var(--linea); border-left: 4px solid var(--acento); border-radius: 10px;
    padding: 14px 16px 14px 56px; margin-bottom: 12px; }
  ol.pasos > li::before { content: counter(p); position: absolute; left: 14px; top: 14px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--acento); color: var(--acento-texto); font-weight: 700;
    display: grid; place-items: center; font-size: .9rem; }
  .pasos h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .pasos p { margin: 0; white-space: pre-line; }
  .comun { display: inline-block; font-size: .8rem; color: var(--suave); margin-top: 8px; }
  .param { background: var(--param-fondo); color: var(--param-texto); border-radius: 5px; padding: 0 6px; font-weight: 600; }
  .imagen { margin-top: 10px; max-width: 100%; border-radius: 8px; display: block; }
  .banner { background: var(--rojo); color: #fff; padding: 8px 16px; text-align: center; font-weight: 600; }
  .banner button { margin-left: 10px; font: inherit; border: 1px solid #fff; background: none; color: #fff; border-radius: 6px; padding: 2px 10px; cursor: pointer; }

  /* ===== MODO EDITOR (todo bajo .ed para no mezclarse con el manual) ===== */
  .ed { --verde:#1b7a3d; }
  .ed .tarjeta { background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .ed .fila { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ed .crece { flex:1; }
  .ed label { display:block; font-weight:600; font-size:.88rem; margin:10px 0 3px; color:var(--titulo); }
  .ed input, .ed textarea, .ed select { width:100%; box-sizing:border-box; font:inherit; color:inherit; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:8px; padding:8px 10px; }
  .ed textarea { min-height:110px; resize:vertical; }
  .ed button.b { font:inherit; border:1.5px solid var(--acento); background:var(--tarjeta); color:var(--titulo); border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:600; }
  .ed button.b.pri { background:var(--acento); color:#fff; }
  .ed button.b.pel { border-color:var(--rojo); color:var(--rojo); }
  .ed button.b.mini { padding:3px 9px; font-size:.85rem; }
  .ed button.b:disabled { opacity:.45; cursor:default; }
  .ed .item { display:flex; gap:10px; align-items:center; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .ed .item .txt { flex:1; cursor:pointer; min-width:0; }
  .ed .item .txt strong { display:block; color:var(--titulo); }
  .ed .item .txt span { color:var(--suave); font-size:.88rem; }
  .ed .item.hijo { margin-left:28px; border-left:4px solid var(--rojo); }
  .ed .paso { border-left:4px solid var(--acento); }
  .ed .paso.esbloque { border-left-color:var(--rojo); }
  .ed .num { font-weight:700; color:var(--titulo); }
  .ed .etq { font-size:.78rem; background:#e7ecf6; color:#14275a; border-radius:5px; padding:1px 7px; font-weight:600; }
  .ed .etq.r { background:#fde7ea; color:#9b0c22; }
  .ed .nota { color:var(--suave); font-size:.85rem; }
  .ed .caja-err { background:#fde7ea; border:1.5px solid var(--rojo); color:#5a0a17; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed .caja-av { background:#fff4d6; border:1.5px solid #e0b400; color:#6b4600; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed .caja-ok { background:#e3f4e9; border:1.5px solid var(--verde); color:#12552a; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed ul { margin:6px 0 0; padding-left:20px; }
  .ed .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--linea); }
  .ed .tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:9px 14px; font:inherit; cursor:pointer; color:var(--suave); }
  .ed .tabs button.activa { color:var(--titulo); border-color:var(--rojo); font-weight:700; }
  .ed .barra { position:fixed; left:0; right:0; bottom:0; background:var(--tarjeta); border-top:2px solid var(--acento); padding:10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; z-index:5; }
  .ed .estado { font-weight:600; }
  .ed .estado.sucio { color:var(--rojo); }
  .ed code { background:#e7ecf6; color:#14275a; padding:1px 5px; border-radius:4px; }
  .ed main, main.ed { padding-bottom:120px; }
  .ed .est { font-size: .74rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; display: inline-block; vertical-align: middle; }
  .ed .e-publicado { background: #1b7a3d; color: #fff !important; }
  .ed .e-cambios { background: #fff4d6; color: #6b4600; }
  .ed .e-nuevo { background: #e0ebff; color: #14275a; }
  .ed .e-borrador { background: #6b7280; color: #fff !important; }
  .ed .chip { font: inherit; font-size: .85rem; cursor: pointer; background: var(--tarjeta); color: var(--texto); border: 1.5px solid var(--linea); border-radius: 999px; padding: 4px 12px; }
  .ed .chip.c-publicado { background: #e3f4e9; color: #12552a; border-color: #1b7a3d; font-weight: 600; }
  .ed .chip.c-publicado.activa { background: #1b7a3d; color: #fff; }
  .ed .chip.c-borrador { background: #eceef1; color: #3b4352; border-color: #6b7280; font-weight: 600; }
  .ed .chip.c-borrador.activa { background: #6b7280; color: #fff; }
  .ed .chip.activa { background: var(--acento); color: #fff; border-color: var(--acento); }
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando manual…</p></main>

<script>
/* =====================================================================
   MANUAL DE NÓMINA con MODO EDITOR integrado.
   - Los datos viven en datos/bloques.json y datos/procesos.json.
   - Lectores: ven el manual publicado.
   - Editor: pie de página > "Modo editor" (o dirección #editor).
     Los cambios quedan como BORRADOR en este navegador; para publicarlos
     se descargan los 2 archivos y se suben a la carpeta datos/ del repositorio.
   ===================================================================== */
const app = document.getElementById("app");
const LLAVE = "manual-borrador-v1";
let PUB = null;          // lo publicado (tal como está en los archivos)
let D = null;            // el borrador de trabajo (copia editable)
let verBorrador = false; // vista previa del borrador en el manual
let BLOQUES = {}, PROCESOS = [];

const clonar = o => JSON.parse(JSON.stringify(o));
const limpiar = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rellenar(plantilla, params = {}) {
  return limpiar(plantilla).replace(/\{(\w+)\}/g, (_, k) => k in params ? `<span class="param">${limpiar(params[k])}</span>` : `{${k}}`);
}
/* Convierte los datos crudos en lo que usa el lector */
function derivar(d, conBorradores) {
  BLOQUES = Object.fromEntries((d.bloques || []).map(b => [b.id, b]));
  let procs = d.procesos || [];
  if (!conBorradores) {   // los lectores NO ven los procesos en borrador ni sus subprocesos
    const ocultos = new Set(procs.filter(p => p.estado === "borrador").map(p => p.id));
    procs = procs.filter(p => !ocultos.has(p.id) && !ocultos.has(p.padre));
  }
  PROCESOS = procs.map(p => ({ ...p, pasos: (p.pasos || []).map(s => ({ ...s, params: Object.fromEntries((s.params || []).map(x => [x.nombre, x.valor])) })) }));
}
const tagB = p => p.estado === "borrador" ? ' <span class="etq-b">BORRADOR</span>' : "";
/* Borrador en el navegador (con protección por si el almacenamiento falla) */
const leerBorrador = () => { try { return JSON.parse(localStorage.getItem(LLAVE)); } catch { return null; } };
const guardarBorrador = () => { try { localStorage.setItem(LLAVE, JSON.stringify(D)); } catch {} };
const borrarBorrador = () => { try { localStorage.removeItem(LLAVE); } catch {} };
const hayCambios = () => JSON.stringify(D) !== JSON.stringify(PUB);

/* Imágenes nuevas del borrador (aún no publicadas): ruta -> datos de la imagen */
const LLAVE_IMG = "manual-imagenes-v1";
let IMGS = {}; try { IMGS = JSON.parse(localStorage.getItem(LLAVE_IMG)) || {}; } catch {}
const guardarImgs = () => { try { localStorage.setItem(LLAVE_IMG, JSON.stringify(IMGS)); return true; } catch { return false; } };
const srcImg = (r, previa) => (IMGS[r] && (previa || verBorrador)) ? IMGS[r] : r;
const rutasUsadas = d => [...d.bloques.map(b => b.imagen), ...d.procesos.flatMap(p => p.pasos.map(s => s.imagen))].filter(Boolean);

/* Áreas del manual. Los procesos y pasos comunes sin campo "area" se consideran de Nómina. */
const AREAS = [{ id: "nomina", nombre: "Nómina" }, { id: "contratacion", nombre: "Contratación" }];
const areaDe = x => x.area || "nomina";
const nombreArea = id => (AREAS.find(a => a.id === id) || { nombre: id }).nombre;
function crearBotonAdmin() {
  if (document.getElementById("btnAdmin")) return;
  const b = document.createElement("button"); b.id = "btnAdmin"; b.type = "button"; b.className = "btn-admin";
  b.textContent = "🔒 Administrador"; b.title = "Entrar al modo administrador (pide clave)"; b.onclick = () => { location.hash = "admin"; };
  document.body.append(b);
}

/* ================= LECTOR ================= */
function pintarPaso(paso) {
  let titulo, texto, imagen = "", etiqueta = "";
  if (paso.bloque) {
    const b = BLOQUES[paso.bloque];
    if (!b) return `<li><h3>Falta el bloque: ${limpiar(paso.bloque)}</h3><p>Revisa que este bloque exista, escrito igual.</p></li>`;
    titulo = rellenar(b.titulo, paso.params); texto = rellenar(b.texto, paso.params);
    imagen = paso.imagen || b.imagen || ""; etiqueta = '<span class="comun">Paso común a varios procesos</span>';
  } else {
    titulo = rellenar(paso.titulo, paso.params); texto = rellenar(paso.texto, paso.params); imagen = paso.imagen || "";
  }
  const media = imagen ? `<img class="imagen" src="${limpiar(srcImg(imagen))}" alt="Captura del paso">` : "";
  return `<li><h3>${titulo}</h3><p>${texto}</p>${media}${etiqueta}</li>`;
}
/* ===== BÚSQUEDA: por nombre y por palabras dentro de los pasos (incluye el texto de los pasos comunes) ===== */
const textoPlano = (t, params = {}) => String(t ?? "").replace(/\{(\w+)\}/g, (_, k) => k in params ? params[k] : "");
function piezasProceso(p) {
  const piezas = [{ donde: "", texto: p.nombre }, { donde: "", texto: p.resumen || "" }];
  p.pasos.forEach((s, i) => {
    const b = s.bloque ? BLOQUES[s.bloque] : s; if (!b) return;
    piezas.push({ donde: "Paso " + (i + 1), texto: textoPlano(b.titulo, s.params) + ". " + textoPlano(b.texto, s.params) });
  });
  return piezas;
}
function buscarProcesos(q, areaId) {
  const tokens = normaliza(q).split(/\s+/).filter(Boolean); if (!tokens.length) return { tokens, res: [] };
  const res = [];
  PROCESOS.filter(p => !areaId || areaDe(p) === areaId).forEach(p => {
    const piezas = piezasProceso(p);
    if (!tokens.every(t => normaliza(piezas.map(x => x.texto).join(" ")).includes(t))) return;   // todas las palabras, en cualquier orden
    const enNombre = tokens.every(t => normaliza(p.nombre).includes(t));
    let frag = null;
    for (const pz of piezas.slice(2)) { const n = normaliza(pz.texto), t = tokens.find(t => n.includes(t)); if (t) { frag = { donde: pz.donde, texto: pz.texto, i: n.indexOf(t) }; break; } }
    res.push({ p, enNombre, frag });
  });
  res.sort((a, b) => b.enNombre - a.enNombre);
  return { tokens, res };
}
function fragmentoHtml(frag, tokens) {
  const ini = Math.max(0, frag.i - 45), fin = Math.min(frag.texto.length, frag.i + 95), s = frag.texto.slice(ini, fin), ns = normaliza(s);
  const marcas = [];
  if (ns.length === s.length) tokens.forEach(tk => { let i = ns.indexOf(tk); while (i >= 0) { marcas.push([i, i + tk.length]); i = ns.indexOf(tk, i + tk.length); } });
  marcas.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [a, b] of marcas) { if (b <= pos) continue; const desde = Math.max(a, pos); out += limpiar(s.slice(pos, desde)) + "<mark>" + limpiar(s.slice(desde, b)) + "</mark>"; pos = b; }
  return (ini > 0 ? "…" : "") + out + limpiar(s.slice(pos)) + (fin < frag.texto.length ? "…" : "");
}
function tarjetaResultado(r, tokens, conArea) {
  const padre = r.p.padre && PROCESOS.find(x => x.id === r.p.padre);
  return `<button class="proceso" data-id="${limpiar(r.p.id)}"><strong>${limpiar(r.p.nombre)}${tagB(r.p)}` +
    (conArea ? ` <span class="etq-a">${limpiar(nombreArea(areaDe(r.p)))}</span>` : "") +
    (padre ? ` <span class="etq-a">Subproceso de ${limpiar(padre.nombre)}</span>` : "") + `</strong>` +
    `<span>${limpiar(r.p.resumen)}</span>` +
    (r.frag ? `<span class="frag"><b>${limpiar(r.frag.donde)}:</b> ${fragmentoHtml(r.frag, tokens)}</span>` : "") + `</button>`;
}
function pintarResultados(caja, q, areaId, conArea) {
  const { tokens, res } = buscarProcesos(q, areaId);
  caja.innerHTML = res.length
    ? `<p class="sub" style="margin:0 0 4px">${res.length} ${res.length === 1 ? "resultado" : "resultados"}</p>` + res.map(r => tarjetaResultado(r, tokens, conArea)).join("")
    : '<p class="vacio">No encontramos nada con esas palabras. Prueba con otras o con menos palabras.</p>';
}
function verAreas() {
  app.innerHTML = `<h1>Manual de procesos</h1><p class="sub">¿De qué área es el proceso?</p>
    <input id="buscador" type="search" placeholder="Buscar en todos los procesos: por nombre o por una palabra de los pasos" aria-label="Buscar">
    <div class="lista" id="resultados" hidden></div>
    <div class="areas" id="areas">${AREAS.map(a => { const n = PROCESOS.filter(p => !p.padre && areaDe(p) === a.id).length;
      return `<button class="area" data-area="${a.id}"><strong>${limpiar(a.nombre)}</strong><span>${n} ${n === 1 ? "proceso" : "procesos"}</span></button>`; }).join("")}</div>`;
  const buscador = document.getElementById("buscador"), res = document.getElementById("resultados"), areas = document.getElementById("areas");
  areas.addEventListener("click", e => { const b = e.target.closest("button[data-area]"); if (b) location.hash = "/" + b.dataset.area; });
  res.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  buscador.addEventListener("input", () => {
    const hay = buscador.value.trim() !== ""; res.hidden = !hay; areas.hidden = hay;
    if (hay) pintarResultados(res, buscador.value, null, true);
  });
}
function verMenu(area) {
  app.innerHTML = `<button class="volver" id="todas">‹ Todas las áreas</button>
    <h1>${limpiar(area.nombre)}</h1><p class="sub">¿De qué proceso quieres saber?</p>
    <input id="buscador" type="search" placeholder="Buscar un proceso o una palabra de sus pasos" aria-label="Buscar">
    <div class="lista" id="lista"></div>`;
  const lista = document.getElementById("lista"), buscador = document.getElementById("buscador");
  document.getElementById("todas").onclick = () => { location.hash = ""; };
  function filtrar() {
    if (buscador.value.trim()) return pintarResultados(lista, buscador.value, area.id, false);
    const propios = PROCESOS.filter(p => !p.padre && areaDe(p) === area.id);
    lista.innerHTML = propios.length
      ? propios.map(p => `<button class="proceso" data-id="${limpiar(p.id)}"><strong>${limpiar(p.nombre)}${tagB(p)}</strong><span>${limpiar(p.resumen)}</span></button>`).join("")
      : '<p class="vacio">Aún no hay procesos en esta área.</p>';
  }
  buscador.addEventListener("input", filtrar);
  lista.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  filtrar();
}
function verProceso(p) {
  const hijos = PROCESOS.filter(x => x.padre === p.id), padre = PROCESOS.find(x => x.id === p.padre);
  app.innerHTML = `
    <button class="volver" id="volver">‹ ${padre ? "Volver a " + limpiar(padre.nombre) : "Volver a " + limpiar(nombreArea(areaDe(p)))}</button>
    <h2>${limpiar(p.nombre)}${tagB(p)}</h2><p class="sub">${limpiar(p.resumen)}</p>
    ${hijos.length ? `<h3>Subprocesos</h3><div class="lista" id="hijos">${hijos.map(h => `<button class="proceso" data-id="${limpiar(h.id)}"><strong>${limpiar(h.nombre)}</strong><span>${limpiar(h.resumen)}</span></button>`).join("")}</div>` : ""}
    <ol class="pasos">${p.pasos.map(pintarPaso).join("")}</ol>`;
  document.getElementById("volver").onclick = () => { location.hash = padre ? padre.id : "/" + areaDe(p); };
  const caja = document.getElementById("hijos");
  if (caja) caja.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  window.scrollTo(0, 0);
}
function poner(banner) {
  document.getElementById("banner")?.remove();
  if (banner) document.body.insertBefore(banner, document.body.firstChild);
}
function navegar() {
  const id = decodeURIComponent(location.hash.slice(1));

/* Validación de enlaces y datos (igual que en el servidor del módulo admin) */
function validar(d) {
  const errores = [], avisos = [], idsB = new Set(), idsP = new Set();
  d.bloques.forEach((b, i) => {
    const et = `Bloque ${i + 1}${b.id ? " (" + b.id + ")" : ""}`;
    if (!b.id || !ID_OK.test(b.id)) errores.push(`${et}: el identificador debe usar solo letras sin tildes, números, guiones o guion bajo.`);
    else if (idsB.has(b.id)) errores.push(`${et}: identificador repetido.`);
    idsB.add(b.id);
    if (!String(b.titulo || "").trim()) errores.push(`${et}: falta el título.`);
    if (!String(b.texto || "").trim()) errores.push(`${et}: falta el texto.`);
  });
  d.procesos.forEach((p, i) => {
    const et = `Proceso ${i + 1}${p.id ? " (" + p.id + ")" : ""}`;
    // Un proceso en BORRADOR puede estar incompleto: sus faltas son avisos y no impiden publicar lo demás
    const enBorrador = p.estado === "borrador", dest = enBorrador ? avisos : errores, pre = enBorrador ? "[En borrador, no impide publicar] " : "";
    if (!p.id || !ID_OK.test(p.id)) errores.push(`${et}: el identificador debe usar solo letras sin tildes, números, guiones o guion bajo.`);
    else if (idsP.has(p.id)) errores.push(`${et}: identificador repetido.`);
    idsP.add(p.id);
    if (!String(p.nombre || "").trim()) dest.push(`${pre}${et}: falta el nombre.`);
    if (!AREAS.some(a => a.id === areaDe(p))) errores.push(`${et}: área desconocida.`);
    if (!p.pasos.length && !enBorrador) avisos.push(`${et}: no tiene pasos.`);
    p.pasos.forEach((s, j) => {
      const ep = `${et}, paso ${j + 1}`;
      if ("bloque" in s) {
        const b = d.bloques.find(x => x.id === s.bloque);
        if (!b) dest.push(`${pre}${ep}: usa el bloque "${s.bloque}" que no existe.`);
        else if (areaDe(b) !== areaDe(p)) dest.push(`${pre}${ep}: usa un paso común del área ${nombreArea(areaDe(b))}, pero este proceso es de ${nombreArea(areaDe(p))}. Cada área tiene sus propios pasos comunes.`);
        else paramsDe(b).forEach(n => { if (!(s.params || []).some(x => x.nombre === n)) avisos.push(`${pre}${ep}: el bloque "${s.bloque}" necesita el valor de {${n}}.`); });
      } else if (!String(s.titulo || "").trim()) dest.push(`${pre}${ep}: falta el título.`);
    });
  });
  d.procesos.forEach(p => {
    if (p.padre && !idsP.has(p.padre)) errores.push(`Proceso "${p.id}": su proceso padre "${p.padre}" no existe.`);
    if (p.padre === p.id) errores.push(`Proceso "${p.id}": no puede ser padre de sí mismo.`);
    const pa = p.padre && d.procesos.find(x => x.id === p.padre);
    if (pa && areaDe(pa) !== areaDe(p)) errores.push(`Proceso "${p.id}": su proceso padre es de otra área.`);
  });
  return { errores, avisos };
}

const imagenesNuevas = () => [...new Set(rutasUsadas(D))].filter(r => IMGS[r]);
function reducirImagen(file) {   // reduce a 1400 px de ancho y la comprime para que pese poco
  return new Promise((ok, mal) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1400 / im.width), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL("image/webp", 0.9));
    };
    im.onerror = () => mal(new Error("No se pudo leer ese archivo como imagen."));
    im.src = u;
  });
}

const LLAVE_CFG = "manual-pub-cfg-v1";

    method: metodo, headers: { Authorization: "Bearer " + TOKEN, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.message || ("Error " + r.status)); e.codigo = r.status; throw e; }

}
const aBase64 = t => { let x = ""; new TextEncoder().encode(t).forEach(c => x += String.fromCharCode(c)); return btoa(x); };

  if (e.codigo === 403 || e.codigo === 404) return "GitHub no permite esa acción. Revisa que el token tenga el permiso «Contents: Read and write» sobre este repositorio y que el nombre del propietario y del repositorio estén bien escritos.";

}
async function publicarEnGithub() {
  const c = cfgRepo(), v = validar(D);
  if (v.errores.length) { mensajes = { err: { titulo: "No se puede publicar todavía. Corrige esto:", lista: v.errores }, av: v.avisos }; return pintarEditor(); }
  if (!TOKEN || !c.owner || !c.repo) { pestana = "publicacion"; mensajes = { err: { titulo: "Antes de publicar, configura la conexión con GitHub (una sola vez).", lista: [] } }; return pintarEditor(); }
  if (!confirm("¿Publicar los cambios? Todos los lectores los verán en 1 o 2 minutos.")) return;
  mensajes = { ok: "Publicando… no cierres esta página." }; pintarEditor();
  try {
    const rep = await gh(""), rama = c.branch || rep.default_branch;
    const base = (await gh("/git/ref/heads/" + rama)).object.sha, commitBase = await gh("/git/commits/" + base);
    // Si alguien publicó algo distinto mientras editabas, no lo pisamos
    for (const [ruta, mio, clave] of [["datos/bloques.json", PUB.bloques, "bloques"], ["datos/procesos.json", PUB.procesos, "procesos"]]) {
      const f = await gh("/contents/" + ruta + "?ref=" + rama);
      if (canon(JSON.parse(deBase64(f.content))[clave]) !== canon(mio))
        throw Object.assign(new Error("Otra persona publicó cambios mientras editabas, y para no pisarlos no se publicó nada. Tus cambios siguen guardados en este navegador. Avisa al responsable para revisar ambos cambios."), { codigo: "conflicto" });
    }
    const archivos = [["datos/bloques.json", aBase64(JSON.stringify({ bloques: D.bloques }, null, 2) + "\n")], ["datos/procesos.json", aBase64(JSON.stringify({ procesos: D.procesos }, null, 2) + "\n")]];
    const nuevas = imagenesNuevas(); nuevas.forEach(r => archivos.push([r, IMGS[r].split(",")[1]]));
    const arbol = [];
    for (const [ruta, b64] of archivos) { const bl = await gh("/git/blobs", { metodo: "POST", cuerpo: { content: b64, encoding: "base64" } }); arbol.push({ path: ruta, mode: "100644", type: "blob", sha: bl.sha }); }

    const nc = await gh("/git/commits", { metodo: "POST", cuerpo: { message: "Actualización del manual desde el modo administrador", tree: nt.sha, parents: [base] } });
    await gh("/git/refs/heads/" + rama, { metodo: "PATCH", cuerpo: { sha: nc.sha } });

}

      const b2 = D.bloques.find(x => x.id === s.bloque), rep = t => t.replace(/\{(\w+)\}/g, (_, n) => s.params.find(x => x.nombre === n)?.valor ?? `{${n}}`);
      const img = s.imagen, titulo = b2 ? rep(b2.titulo) : "", texto = b2 ? rep(b2.texto) : "";
      Object.keys(s).forEach(k => delete s[k]); s.titulo = titulo; s.texto = texto; if (img) s.imagen = img; marcarSucio(); pintarEditor();
    } }, "Convertir en paso propio (copia el texto)")));
  }
  return caja;
}

/* ----- BLOQUES ----- */
function vistaBloques(el) {
  if (selBloque) { const b = D.bloques.find(x => x.id === selBloque); if (b) return editorBloque(el, b); selBloque = null; }
  el.append(selectorArea(id => D.bloques.filter(b => areaDe(b) === id).length));
  el.append(h("div", { class: "fila", style: "margin-bottom:6px" }, h("h3", { class: "crece", style: "margin:0" }, "Pasos comunes de " + nombreArea(areaEd)),
    h("button", { class: "b pri", onclick: () => {
      const id = idUnico("nuevo_paso_comun", new Set(D.bloques.map(b => b.id)));
      D.bloques.push({ id, area: areaEd, titulo: "Nuevo paso común", texto: "" }); selBloque = id; busquedaBl = ""; marcarSucio(); pintarEditor();
    } }, "+ Nuevo bloque")),
    h("p", { class: "nota" }, "Un bloque es un paso que se repite en varios procesos de esta misma área. Si lo cambias aquí, cambia en todos los que lo usan."));
  const buscador = h("input", { type: "search", value: busquedaBl, "aria-label": "Buscar", placeholder: "Buscar un paso común (en todas las áreas)", style: "margin-bottom:10px", oninput: e => { busquedaBl = e.target.value; dibujar(); } });
  const caja = h("div", {}); el.append(buscador, caja);
  function dibujar() {
    const q = normaliza(busquedaBl);
    const lista = (q ? D.bloques : D.bloques.filter(b => areaDe(b) === areaEd)).filter(b => !q || normaliza(b.titulo + " " + b.texto).includes(q));
    const moverEn = (b, dir) => { const k = lista.indexOf(b), o = lista[k + dir]; if (!o) return; mover(D.bloques, D.bloques.indexOf(b), D.bloques.indexOf(o) - D.bloques.indexOf(b)); pintarEditor(); };
    reponer(caja,
      !lista.length ? h("p", { class: "nota" }, q ? "No hay pasos comunes que coincidan con la búsqueda." : "Aún no hay pasos comunes en esta área.") : null,
      lista.map((b, i) => h("div", { class: "item" },
        h("div", { class: "txt", onclick: () => { areaEd = areaDe(b); selBloque = b.id; pintarEditor(); } },
          h("strong", {}, b.titulo, " ", q ? h("span", { class: "etq" }, nombreArea(areaDe(b))) : null), h("span", {}, `Usado ${usosBloque(b.id)} veces`)),
        !q ? [h("button", { class: "b mini", disabled: i === 0, onclick: () => moverEn(b, -1) }, "↑"), h("button", { class: "b mini", disabled: i === lista.length - 1, onclick: () => moverEn(b, 1) }, "↓")] : null)));
  }
  dibujar();
}
function editorBloque(el, b) {
  const usos = D.procesos.filter(p => p.pasos.some(s => s.bloque === b.id));
  const ta = h("textarea", { oninput: e => { b.texto = e.target.value; marcarSucio(); } }); ta.value = b.texto || "";
  el.append(h("button", { class: "b", onclick: () => { selBloque = null; pintarEditor(); } }, "‹ Volver a la lista"),
    h("div", { class: "tarjeta", style: "margin-top:12px" },
      h("label", {}, "Título del paso"), h("input", { value: b.titulo, oninput: e => { b.titulo = e.target.value; autoIdBloque(b); const c = document.getElementById("idint"); if (c) c.textContent = b.id; marcarSucio(); } }),
      h("label", {}, "Instrucciones"), ta,
      h("p", { class: "nota" }, "Para valores que cambian en cada proceso escribe el nombre entre llaves, por ejemplo ", h("code", {}, "{archivo}"), ". Cada proceso que use el bloque indicará el valor."),
      controlImagen(b), h("p", { class: "nota" }, "Identificador interno (automático, no necesitas tocarlo): ", h("code", { id: "idint" }, b.id))),
    h("h3", {}, "Procesos que usan este bloque"), usos.length ? h("ul", {}, usos.map(p => h("li", {}, p.nombre))) : h("p", { class: "nota" }, "Ninguno todavía."),
    h("hr", { style: "margin:26px 0 14px;border:0;border-top:1px solid var(--linea)" }),
    h("button", { class: "b pel", onclick: () => {
      if (usos.length) return alert("No se puede eliminar: lo usan " + usos.map(p => p.nombre).join(", ") + ". Primero quítalo de ellos.");
      if (!confirm("¿Eliminar este bloque?")) return;
      D.bloques.splice(D.bloques.indexOf(b), 1); selBloque = null; marcarSucio(); pintarEditor();
    } }, "Eliminar este bloque"));
}

/* ================= ARRANQUE ================= */
const cargar = url => fetch(url, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(url); return r.json(); });
Promise.all([cargar("datos/bloques.json"), cargar("datos/procesos.json"), cargar("datos/admin.json").catch(() => null)])
  .then(([b, p, a]) => {
    ADMIN = a; crearBotonAdmin();
    { const usadas = new Set(rutasUsadas({ bloques: b.bloques, procesos: p.procesos })); let t = false; Object.keys(IMGS).forEach(r => { if (usadas.has(r)) { delete IMGS[r]; t = true; } }); if (t) guardarImgs(); }
    PUB = { bloques: b.bloques, procesos: p.procesos };
    const guardado = leerBorrador();
    D = guardado && guardado.bloques && guardado.procesos ? guardado : clonar(PUB);
    window.addEventListener("hashchange", navegar);
    navegar();
  })
  .catch(() => { app.innerHTML = '<h1>No se pudo cargar el manual</h1><p class="sub">Faltan los archivos datos/bloques.json o datos/procesos.json. Avisa al responsable del manual.</p>'; });
</script>
