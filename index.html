<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual de nómina</title>
<style>
  /* ===== COLORES: azul oscuro, rojo y gris ===== */
  :root {
    --fondo: #eceff3; --tarjeta: #ffffff; --texto: #1a2433; --suave: #5d6a7c;
    --linea: #d2d8e0; --acento: #14275a; --acento-texto: #ffffff;
    --titulo: #14275a; --rojo: #c8102e;
    --param-fondo: #fde7ea; --param-texto: #9b0c22;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #0b1424; --tarjeta: #14203a; --texto: #e7ecf4; --suave: #9ba8bc;
      --linea: #263451; --acento: #3d65c9; --acento-texto: #ffffff;
      --titulo: #dbe5ff; --rojo: #ff5c72;
      --param-fondo: #4a1822; --param-texto: #ffb3be;
    }
  }
  body { margin: 0; background: var(--fondo); color: var(--texto); border-top: 6px solid var(--rojo);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 18px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 8px 0 6px; color: var(--titulo); }
  h2 { font-size: 1.35rem; margin: 0 0 4px; color: var(--titulo); }
  p.sub { color: var(--suave); margin: 0 0 20px; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  /* ===== MENÚ ===== */
  #buscador { width: 100%; box-sizing: border-box; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--tarjeta); border: 1.5px solid var(--linea); border-radius: 10px; margin-bottom: 14px; }
  .lista { display: grid; gap: 10px; }
  .proceso { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
    background: var(--tarjeta); border: 1.5px solid var(--linea); border-radius: 10px; padding: 14px 16px; }
  .proceso:hover { border-color: var(--rojo); }
  .proceso strong { display: block; color: var(--titulo); }
  .proceso span { color: var(--suave); font-size: .92rem; }
  .vacio { color: var(--suave); padding: 12px 2px; }
  .pie { margin-top: 36px; text-align: center; }
  .pie button { background: none; border: 0; color: var(--suave); font: inherit; font-size: .85rem; cursor: pointer; text-decoration: underline; }

  /* ===== PASO A PASO ===== */
  .volver { background: none; border: 0; color: var(--rojo); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
  ol.pasos { list-style: none; counter-reset: p; padding: 0; margin: 20px 0 0; }
  ol.pasos > li { counter-increment: p; position: relative; background: var(--tarjeta);
    border: 1.5px solid var(--linea); border-left: 4px solid var(--acento); border-radius: 10px;
    padding: 14px 16px 14px 56px; margin-bottom: 12px; }
  ol.pasos > li::before { content: counter(p); position: absolute; left: 14px; top: 14px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--acento); color: var(--acento-texto); font-weight: 700;
    display: grid; place-items: center; font-size: .9rem; }
  .pasos h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .pasos p { margin: 0; white-space: pre-line; }
  .comun { display: inline-block; font-size: .8rem; color: var(--suave); margin-top: 8px; }
  .param { background: var(--param-fondo); color: var(--param-texto); border-radius: 5px; padding: 0 6px; font-weight: 600; }
  .imagen { margin-top: 10px; max-width: 100%; border-radius: 8px; display: block; }
  .banner { background: var(--rojo); color: #fff; padding: 8px 16px; text-align: center; font-weight: 600; }
  .banner button { margin-left: 10px; font: inherit; border: 1px solid #fff; background: none; color: #fff; border-radius: 6px; padding: 2px 10px; cursor: pointer; }

  /* ===== MODO EDITOR (todo bajo .ed para no mezclarse con el manual) ===== */
  .ed { --verde:#1b7a3d; }
  .ed .tarjeta { background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .ed .fila { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ed .crece { flex:1; }
  .ed label { display:block; font-weight:600; font-size:.88rem; margin:10px 0 3px; color:var(--titulo); }
  .ed input, .ed textarea, .ed select { width:100%; box-sizing:border-box; font:inherit; color:inherit; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:8px; padding:8px 10px; }
  .ed textarea { min-height:110px; resize:vertical; }
  .ed button.b { font:inherit; border:1.5px solid var(--acento); background:var(--tarjeta); color:var(--titulo); border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:600; }
  .ed button.b.pri { background:var(--acento); color:#fff; }
  .ed button.b.pel { border-color:var(--rojo); color:var(--rojo); }
  .ed button.b.mini { padding:3px 9px; font-size:.85rem; }
  .ed button.b:disabled { opacity:.45; cursor:default; }
  .ed .item { display:flex; gap:10px; align-items:center; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .ed .item .txt { flex:1; cursor:pointer; min-width:0; }
  .ed .item .txt strong { display:block; color:var(--titulo); }
  .ed .item .txt span { color:var(--suave); font-size:.88rem; }
  .ed .item.hijo { margin-left:28px; border-left:4px solid var(--rojo); }
  .ed .paso { border-left:4px solid var(--acento); }
  .ed .paso.esbloque { border-left-color:var(--rojo); }
  .ed .num { font-weight:700; color:var(--titulo); }
  .ed .etq { font-size:.78rem; background:#e7ecf6; color:#14275a; border-radius:5px; padding:1px 7px; font-weight:600; }
  .ed .etq.r { background:#fde7ea; color:#9b0c22; }
  .ed .nota { color:var(--suave); font-size:.85rem; }
  .ed .caja-err { background:#fde7ea; border:1.5px solid var(--rojo); color:#5a0a17; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed .caja-av { background:#fff4d6; border:1.5px solid #e0b400; color:#6b4600; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed .caja-ok { background:#e3f4e9; border:1.5px solid var(--verde); color:#12552a; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed ul { margin:6px 0 0; padding-left:20px; }
  .ed .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--linea); }
  .ed .tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:9px 14px; font:inherit; cursor:pointer; color:var(--suave); }
  .ed .tabs button.activa { color:var(--titulo); border-color:var(--rojo); font-weight:700; }
  .ed .barra { position:fixed; left:0; right:0; bottom:0; background:var(--tarjeta); border-top:2px solid var(--acento); padding:10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; z-index:5; }
  .ed .estado { font-weight:600; }
  .ed .estado.sucio { color:var(--rojo); }
  .ed code { background:#e7ecf6; color:#14275a; padding:1px 5px; border-radius:4px; }
  .ed main, main.ed { padding-bottom:120px; }
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando manual…</p></main>

<script>
/* =====================================================================
   MANUAL DE NÓMINA con MODO EDITOR integrado.
   - Los datos viven en datos/bloques.json y datos/procesos.json.
   - Lectores: ven el manual publicado.
   - Editor: pie de página > "Modo editor" (o dirección #editor).
     Los cambios quedan como BORRADOR en este navegador; para publicarlos
     se descargan los 2 archivos y se suben a la carpeta datos/ del repositorio.
   ===================================================================== */
const app = document.getElementById("app");
const LLAVE = "manual-borrador-v1";
let PUB = null;          // lo publicado (tal como está en los archivos)
let D = null;            // el borrador de trabajo (copia editable)
let verBorrador = false; // vista previa del borrador en el manual
let BLOQUES = {}, PROCESOS = [];

const clonar = o => JSON.parse(JSON.stringify(o));
const limpiar = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rellenar(plantilla, params = {}) {
  return limpiar(plantilla).replace(/\{(\w+)\}/g, (_, k) => k in params ? `<span class="param">${limpiar(params[k])}</span>` : `{${k}}`);
}
/* Convierte los datos crudos en lo que usa el lector */
function derivar(d) {
  BLOQUES = Object.fromEntries((d.bloques || []).map(b => [b.id, b]));
  PROCESOS = (d.procesos || []).map(p => ({ ...p, pasos: (p.pasos || []).map(s => ({ ...s, params: Object.fromEntries((s.params || []).map(x => [x.nombre, x.valor])) })) }));
}
/* Borrador en el navegador (con protección por si el almacenamiento falla) */
const leerBorrador = () => { try { return JSON.parse(localStorage.getItem(LLAVE)); } catch { return null; } };
const guardarBorrador = () => { try { localStorage.setItem(LLAVE, JSON.stringify(D)); } catch {} };
const borrarBorrador = () => { try { localStorage.removeItem(LLAVE); } catch {} };
const hayCambios = () => JSON.stringify(D) !== JSON.stringify(PUB);

/* Imágenes nuevas del borrador (aún no publicadas): ruta -> datos de la imagen */
const LLAVE_IMG = "manual-imagenes-v1";
let IMGS = {}; try { IMGS = JSON.parse(localStorage.getItem(LLAVE_IMG)) || {}; } catch {}
const guardarImgs = () => { try { localStorage.setItem(LLAVE_IMG, JSON.stringify(IMGS)); return true; } catch { return false; } };
const srcImg = (r, previa) => (IMGS[r] && (previa || verBorrador)) ? IMGS[r] : r;
const rutasUsadas = d => [...d.bloques.map(b => b.imagen), ...d.procesos.flatMap(p => p.pasos.map(s => s.imagen))].filter(Boolean);

/* ================= LECTOR ================= */
function pintarPaso(paso) {
  let titulo, texto, imagen = "", etiqueta = "";
  if (paso.bloque) {
    const b = BLOQUES[paso.bloque];
    if (!b) return `<li><h3>Falta el bloque: ${limpiar(paso.bloque)}</h3><p>Revisa que este bloque exista, escrito igual.</p></li>`;
    titulo = rellenar(b.titulo, paso.params); texto = rellenar(b.texto, paso.params);
    imagen = paso.imagen || b.imagen || ""; etiqueta = '<span class="comun">Paso común a varios procesos</span>';
  } else {
    titulo = rellenar(paso.titulo, paso.params); texto = rellenar(paso.texto, paso.params); imagen = paso.imagen || "";
  }
  const media = imagen ? `<img class="imagen" src="${limpiar(srcImg(imagen))}" alt="Captura del paso">` : "";
  return `<li><h3>${titulo}</h3><p>${texto}</p>${media}${etiqueta}</li>`;
}
function verMenu() {
  app.innerHTML = `<h1>Manual de nómina</h1><p class="sub">¿De qué proceso quieres saber?</p>
    <input id="buscador" type="search" placeholder="Buscar un proceso o una palabra" aria-label="Buscar">
    <div class="lista" id="lista"></div>`;
  const lista = document.getElementById("lista"), buscador = document.getElementById("buscador");
  function filtrar() {
    const q = buscador.value.toLowerCase();
    const hallados = PROCESOS.filter(p => !p.padre && (p.nombre + " " + p.resumen + " " + JSON.stringify(p.pasos)).toLowerCase().includes(q));
    lista.innerHTML = hallados.length
      ? hallados.map(p => `<button class="proceso" data-id="${limpiar(p.id)}"><strong>${limpiar(p.nombre)}</strong><span>${limpiar(p.resumen)}</span></button>`).join("")
      : '<p class="vacio">No encontramos ese proceso. Prueba con otra palabra.</p>';
  }
  buscador.addEventListener("input", filtrar);
  lista.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  filtrar();
}
function verProceso(p) {
  const hijos = PROCESOS.filter(x => x.padre === p.id), padre = PROCESOS.find(x => x.id === p.padre);
  app.innerHTML = `
    <button class="volver" id="volver">‹ ${padre ? "Volver a " + limpiar(padre.nombre) : "Volver al menú"}</button>
    <h2>${limpiar(p.nombre)}</h2><p class="sub">${limpiar(p.resumen)}</p>
    ${hijos.length ? `<h3>Subprocesos</h3><div class="lista" id="hijos">${hijos.map(h => `<button class="proceso" data-id="${limpiar(h.id)}"><strong>${limpiar(h.nombre)}</strong><span>${limpiar(h.resumen)}</span></button>`).join("")}</div>` : ""}
    <ol class="pasos">${p.pasos.map(pintarPaso).join("")}</ol>`;
  document.getElementById("volver").onclick = () => { location.hash = padre ? padre.id : ""; };
  const caja = document.getElementById("hijos");
  if (caja) caja.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  window.scrollTo(0, 0);
}
function poner(banner) {
  document.getElementById("banner")?.remove();
  if (banner) document.body.insertBefore(banner, document.body.firstChild);
}
function navegar() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "admin" || id === "editor") { poner(null); return acceso(); }
  app.className = ""; derivar(verBorrador ? D : PUB);
  if (verBorrador) {
    const b = document.createElement("div"); b.id = "banner"; b.className = "banner";
    b.innerHTML = 'Vista previa del BORRADOR (no publicado) <button id="volEd">Volver al editor</button>';
    poner(b); b.querySelector("button").onclick = () => { verBorrador = false; location.hash = "editor"; };
  } else poner(null);
  const p = PROCESOS.find(x => x.id === id);
  p ? verProceso(p) : verMenu();
}

/* ================= ACCESO DE ADMINISTRADOR ================= */
let ADMIN = null;            // {sal, hash} leído de datos/admin.json
let ADM_OK = false;          // true mientras el administrador esté dentro
try { ADM_OK = sessionStorage.getItem("adm") === "1"; } catch {}
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
async function derivarClave(clave, sal) {
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: new TextEncoder().encode(sal), iterations: 200000, hash: "SHA-256" }, k, 256));
}
function fijarAdmin(v) { ADM_OK = v; try { v ? sessionStorage.setItem("adm", "1") : sessionStorage.removeItem("adm"); } catch {} }
function acceso() {
  if (ADM_OK) return pintarEditor();
  app.className = "";
  app.innerHTML = `<h1>Acceso de administrador</h1>
    <p class="sub">Esta zona es solo para quienes administran el manual.</p>
    <input id="clave" type="password" placeholder="Clave de administrador" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:12px 14px;font:inherit;color:inherit;background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:10px;margin-bottom:10px">
    <p id="msg" style="color:var(--rojo);min-height:1.5em;margin:0 0 8px"></p>
    <button class="proceso" id="entrar" style="text-align:center;font-weight:700;max-width:220px">Entrar</button>
    <p><button class="volver" id="atras">‹ Volver al manual</button></p>`;
  const msg = document.getElementById("msg"), campo = document.getElementById("clave");
  document.getElementById("atras").onclick = () => { location.hash = ""; };
  async function entrar() {
    if (!ADMIN) { msg.textContent = "No hay clave de administrador configurada (falta datos/admin.json)."; return; }
    msg.textContent = "Verificando…";
    let ok = false; try { ok = (await derivarClave(campo.value, ADMIN.sal)) === ADMIN.hash; } catch { msg.textContent = "Este navegador no permite verificar la clave (se necesita https)."; return; }
    if (ok) { fijarAdmin(true); pintarEditor(); }
    else { await new Promise(r => setTimeout(r, 1200)); msg.textContent = "Clave incorrecta."; campo.select(); }
  }
  document.getElementById("entrar").onclick = entrar;
  campo.addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
  campo.focus();
}

/* ================= EDITOR ================= */
let pestana = "procesos", selProceso = null, selBloque = null;
let mensajes = {};

function h(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag); let valor;
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "value") valor = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  hijos.flat(Infinity).forEach(x => { if (x == null || x === false) return; e.append(x.nodeType ? x : document.createTextNode(x)); });
  if (valor !== undefined) e.value = valor;
  return e;
}
const paramsDe = b => [...new Set(((b?.titulo || "") + " " + (b?.texto || "")).match(/\{(\w+)\}/g)?.map(x => x.slice(1, -1)) || [])];
const usosBloque = id => D.procesos.reduce((n, p) => n + p.pasos.filter(s => s.bloque === id).length, 0);
const ID_OK = /^[A-Za-z0-9][A-Za-z0-9_-]*$/;
function marcarSucio() { guardarBorrador(); actualizarBarra(); }
function mover(lista, i, d) { const j = i + d; if (j < 0 || j >= lista.length) return; [lista[i], lista[j]] = [lista[j], lista[i]]; marcarSucio(); }

/* Validación de enlaces y datos (igual que en el servidor del módulo admin) */
function validar(d) {
  const errores = [], avisos = [], idsB = new Set(), idsP = new Set();
  d.bloques.forEach((b, i) => {
    const et = `Bloque ${i + 1}${b.id ? " (" + b.id + ")" : ""}`;
    if (!b.id || !ID_OK.test(b.id)) errores.push(`${et}: el identificador debe usar solo letras sin tildes, números, guiones o guion bajo.`);
    else if (idsB.has(b.id)) errores.push(`${et}: identificador repetido.`);
    idsB.add(b.id);
    if (!String(b.titulo || "").trim()) errores.push(`${et}: falta el título.`);
    if (!String(b.texto || "").trim()) errores.push(`${et}: falta el texto.`);
  });
  d.procesos.forEach((p, i) => {
    const et = `Proceso ${i + 1}${p.id ? " (" + p.id + ")" : ""}`;
    if (!p.id || !ID_OK.test(p.id)) errores.push(`${et}: el identificador debe usar solo letras sin tildes, números, guiones o guion bajo.`);
    else if (idsP.has(p.id)) errores.push(`${et}: identificador repetido.`);
    idsP.add(p.id);
    if (!String(p.nombre || "").trim()) errores.push(`${et}: falta el nombre.`);
    if (!p.pasos.length) avisos.push(`${et}: no tiene pasos.`);
    p.pasos.forEach((s, j) => {
      const ep = `${et}, paso ${j + 1}`;
      if ("bloque" in s) {
        const b = d.bloques.find(x => x.id === s.bloque);
        if (!b) errores.push(`${ep}: usa el bloque "${s.bloque}" que no existe.`);
        else paramsDe(b).forEach(n => { if (!(s.params || []).some(x => x.nombre === n)) avisos.push(`${ep}: el bloque "${s.bloque}" necesita el valor de {${n}}.`); });
      } else if (!String(s.titulo || "").trim()) errores.push(`${ep}: falta el título.`);
    });
  });
  d.procesos.forEach(p => {
    if (p.padre && !idsP.has(p.padre)) errores.push(`Proceso "${p.id}": su proceso padre "${p.padre}" no existe.`);
    if (p.padre === p.id) errores.push(`Proceso "${p.id}": no puede ser padre de sí mismo.`);
  });
  return { errores, avisos };
}
function descargar(nombre, objeto) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(objeto, null, 2)], { type: "application/json" }));
  a.download = nombre; document.body.append(a); a.click(); a.remove();
}

function descargarBlob(nombre, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.append(a); a.click(); a.remove();
}
const imagenesNuevas = () => [...new Set(rutasUsadas(D))].filter(r => IMGS[r]);
function reducirImagen(file) {   // reduce a 1400 px de ancho y la comprime para que pese poco
  return new Promise((ok, mal) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1400 / im.width), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL("image/webp", 0.9));
    };
    im.onerror = () => mal(new Error("No se pudo leer ese archivo como imagen."));
    im.src = u;
  });
}

function pintarEditor() {
  const cuerpo = h("div", {});
  const tabs = h("div", { class: "tabs" }, [["procesos", "Procesos"], ["bloques", "Pasos comunes (bloques)"], ["ayuda", "Cómo publicar"], ["seguridad", "Clave de administrador"]]
    .map(([k, t]) => h("button", { class: pestana === k ? "activa" : "", onclick: () => { pestana = k; mensajes = {}; pintarEditor(); } }, t)));
  app.className = "ed";
  app.replaceChildren(
    h("div", { class: "fila", style: "margin-bottom:10px" },
      h("button", { class: "b", onclick: () => { fijarAdmin(false); app.className = ""; location.hash = ""; } }, "Cerrar sesión de administrador"),
      h("h2", { class: "crece", style: "margin:0" }, "Modo editor")),
    tabs, cuerpo, h("div", { class: "barra", id: "barra" }));
  cuerpo.append(...cajas());
  ({ procesos: vistaProcesos, bloques: vistaBloques, ayuda: vistaAyuda, seguridad: vistaSeguridad })[pestana](cuerpo);
  actualizarBarra();
  window.scrollTo(0, 0);
