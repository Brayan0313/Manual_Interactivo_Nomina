<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual de nómina</title>
<style>
  /* ===== COLORES: azul oscuro, rojo y gris ===== */
  :root {
    --fondo: #eceff3; --tarjeta: #ffffff; --texto: #1a2433; --suave: #5d6a7c;
    --linea: #d2d8e0; --acento: #14275a; --acento-texto: #ffffff;
    --titulo: #14275a; --rojo: #c8102e;
    --param-fondo: #fde7ea; --param-texto: #9b0c22;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #0b1424; --tarjeta: #14203a; --texto: #e7ecf4; --suave: #9ba8bc;
      --linea: #263451; --acento: #3d65c9; --acento-texto: #ffffff;
      --titulo: #dbe5ff; --rojo: #ff5c72;
      --param-fondo: #4a1822; --param-texto: #ffb3be;
    }
  }
  body { margin: 0; background: var(--fondo); color: var(--texto); border-top: 6px solid var(--rojo);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 18px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 8px 0 6px; color: var(--titulo); }
  h2 { font-size: 1.35rem; margin: 0 0 4px; color: var(--titulo); }
  p.sub { color: var(--suave); margin: 0 0 20px; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  /* ===== MENÚ ===== */
  #buscador { width: 100%; box-sizing: border-box; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--tarjeta); border: 1.5px solid var(--linea); border-radius: 10px; margin-bottom: 14px; }
  .lista { display: grid; gap: 10px; }
  .proceso { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
    background: var(--tarjeta); border: 1.5px solid var(--linea); border-radius: 10px; padding: 14px 16px; }
  .proceso:hover { border-color: var(--rojo); }
  .proceso strong { display: block; color: var(--titulo); }
  .proceso span { color: var(--suave); font-size: .92rem; }
  .vacio { color: var(--suave); padding: 12px 2px; }
  .pie { margin-top: 36px; text-align: center; }
  .pie button { background: none; border: 0; color: var(--suave); font: inherit; font-size: .85rem; cursor: pointer; text-decoration: underline; }

  /* ===== PASO A PASO ===== */
  .volver { background: none; border: 0; color: var(--rojo); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
  ol.pasos { list-style: none; counter-reset: p; padding: 0; margin: 20px 0 0; }
  ol.pasos > li { counter-increment: p; position: relative; background: var(--tarjeta);
    border: 1.5px solid var(--linea); border-left: 4px solid var(--acento); border-radius: 10px;
    padding: 14px 16px 14px 56px; margin-bottom: 12px; }
  ol.pasos > li::before { content: counter(p); position: absolute; left: 14px; top: 14px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--acento); color: var(--acento-texto); font-weight: 700;
    display: grid; place-items: center; font-size: .9rem; }
  .pasos h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .pasos p { margin: 0; white-space: pre-line; }
  .comun { display: inline-block; font-size: .8rem; color: var(--suave); margin-top: 8px; }
  .param { background: var(--param-fondo); color: var(--param-texto); border-radius: 5px; padding: 0 6px; font-weight: 600; }
  .imagen { margin-top: 10px; max-width: 100%; border-radius: 8px; display: block; }
  .banner { background: var(--rojo); color: #fff; padding: 8px 16px; text-align: center; font-weight: 600; }
  .banner button { margin-left: 10px; font: inherit; border: 1px solid #fff; background: none; color: #fff; border-radius: 6px; padding: 2px 10px; cursor: pointer; }

  /* ===== MODO EDITOR (todo bajo .ed para no mezclarse con el manual) ===== */
  .ed { --verde:#1b7a3d; }
  .ed .tarjeta { background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .ed .fila { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ed .crece { flex:1; }
  .ed label { display:block; font-weight:600; font-size:.88rem; margin:10px 0 3px; color:var(--titulo); }
  .ed input, .ed textarea, .ed select { width:100%; box-sizing:border-box; font:inherit; color:inherit; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:8px; padding:8px 10px; }
  .ed textarea { min-height:110px; resize:vertical; }
  .ed button.b { font:inherit; border:1.5px solid var(--acento); background:var(--tarjeta); color:var(--titulo); border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:600; }
  .ed button.b.pri { background:var(--acento); color:#fff; }
  .ed button.b.pel { border-color:var(--rojo); color:var(--rojo); }
  .ed button.b.mini { padding:3px 9px; font-size:.85rem; }
  .ed button.b:disabled { opacity:.45; cursor:default; }
  .ed .item { display:flex; gap:10px; align-items:center; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .ed .item .txt { flex:1; cursor:pointer; min-width:0; }
  .ed .item .txt strong { display:block; color:var(--titulo); }
  .ed .item .txt span { color:var(--suave); font-size:.88rem; }
  .ed .item.hijo { margin-left:28px; border-left:4px solid var(--rojo); }
  .ed .paso { border-left:4px solid var(--acento); }
  .ed .paso.esbloque { border-left-color:var(--rojo); }
  .ed .num { font-weight:700; color:var(--titulo); }
  .ed .etq { font-size:.78rem; background:#e7ecf6; color:#14275a; border-radius:5px; padding:1px 7px; font-weight:600; }
  .ed .etq.r { background:#fde7ea; color:#9b0c22; }
  .ed .nota { color:var(--suave); font-size:.85rem; }
  .ed .caja-err { background:#fde7ea; border:1.5px solid var(--rojo); color:#5a0a17; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed .caja-av { background:#fff4d6; border:1.5px solid #e0b400; color:#6b4600; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed .caja-ok { background:#e3f4e9; border:1.5px solid var(--verde); color:#12552a; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .ed ul { margin:6px 0 0; padding-left:20px; }
  .ed .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--linea); }
  .ed .tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:9px 14px; font:inherit; cursor:pointer; color:var(--suave); }
  .ed .tabs button.activa { color:var(--titulo); border-color:var(--rojo); font-weight:700; }
  .ed .barra { position:fixed; left:0; right:0; bottom:0; background:var(--tarjeta); border-top:2px solid var(--acento); padding:10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; z-index:5; }
  .ed .estado { font-weight:600; }
  .ed .estado.sucio { color:var(--rojo); }
  .ed code { background:#e7ecf6; color:#14275a; padding:1px 5px; border-radius:4px; }
  .ed main, main.ed { padding-bottom:120px; }
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando manual…</p></main>

<script>
/* =====================================================================
   MANUAL DE NÓMINA con MODO EDITOR integrado.
   - Los datos viven en datos/bloques.json y datos/procesos.json.
   - Lectores: ven el manual publicado.
   - Editor: pie de página > "Modo editor" (o dirección #editor).
     Los cambios quedan como BORRADOR en este navegador; para publicarlos
     se descargan los 2 archivos y se suben a la carpeta datos/ del repositorio.
   ===================================================================== */
const app = document.getElementById("app");
const LLAVE = "manual-borrador-v1";
let PUB = null;          // lo publicado (tal como está en los archivos)
let D = null;            // el borrador de trabajo (copia editable)
let verBorrador = false; // vista previa del borrador en el manual
let BLOQUES = {}, PROCESOS = [];

const clonar = o => JSON.parse(JSON.stringify(o));
const limpiar = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rellenar(plantilla, params = {}) {
  return limpiar(plantilla).replace(/\{(\w+)\}/g, (_, k) => k in params ? `<span class="param">${limpiar(params[k])}</span>` : `{${k}}`);
}
/* Convierte los datos crudos en lo que usa el lector */
function derivar(d) {
  BLOQUES = Object.fromEntries((d.bloques || []).map(b => [b.id, b]));
  PROCESOS = (d.procesos || []).map(p => ({ ...p, pasos: (p.pasos || []).map(s => ({ ...s, params: Object.fromEntries((s.params || []).map(x => [x.nombre, x.valor])) })) }));
}
/* Borrador en el navegador (con protección por si el almacenamiento falla) */
const leerBorrador = () => { try { return JSON.parse(localStorage.getItem(LLAVE)); } catch { return null; } };
const guardarBorrador = () => { try { localStorage.setItem(LLAVE, JSON.stringify(D)); } catch {} };
const borrarBorrador = () => { try { localStorage.removeItem(LLAVE); } catch {} };
const hayCambios = () => JSON.stringify(D) !== JSON.stringify(PUB);

/* ================= LECTOR ================= */
function pintarPaso(paso) {
  let titulo, texto, imagen = "", etiqueta = "";
  if (paso.bloque) {
    const b = BLOQUES[paso.bloque];
    if (!b) return `<li><h3>Falta el bloque: ${limpiar(paso.bloque)}</h3><p>Revisa que este bloque exista, escrito igual.</p></li>`;
    titulo = rellenar(b.titulo, paso.params); texto = rellenar(b.texto, paso.params);
    imagen = paso.imagen || b.imagen || ""; etiqueta = '<span class="comun">Paso común a varios procesos</span>';
  } else {
    titulo = rellenar(paso.titulo, paso.params); texto = rellenar(paso.texto, paso.params); imagen = paso.imagen || "";
  }
  const media = imagen ? `<img class="imagen" src="${limpiar(imagen)}" alt="Captura del paso">` : "";
  return `<li><h3>${titulo}</h3><p>${texto}</p>${media}${etiqueta}</li>`;
}
function verMenu() {
  app.innerHTML = `<h1>Manual de nómina</h1><p class="sub">¿De qué proceso quieres saber?</p>
    <input id="buscador" type="search" placeholder="Buscar un proceso o una palabra" aria-label="Buscar">
    <div class="lista" id="lista"></div>
    <div class="pie"><button id="irEditor">Modo editor</button></div>`;
  const lista = document.getElementById("lista"), buscador = document.getElementById("buscador");
  function filtrar() {
    const q = buscador.value.toLowerCase();
    const hallados = PROCESOS.filter(p => !p.padre && (p.nombre + " " + p.resumen + " " + JSON.stringify(p.pasos)).toLowerCase().includes(q));
    lista.innerHTML = hallados.length
      ? hallados.map(p => `<button class="proceso" data-id="${limpiar(p.id)}"><strong>${limpiar(p.nombre)}</strong><span>${limpiar(p.resumen)}</span></button>`).join("")
      : '<p class="vacio">No encontramos ese proceso. Prueba con otra palabra.</p>';
  }
  buscador.addEventListener("input", filtrar);
  lista.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  document.getElementById("irEditor").onclick = () => { location.hash = "editor"; };
  filtrar();
}
function verProceso(p) {
  const hijos = PROCESOS.filter(x => x.padre === p.id), padre = PROCESOS.find(x => x.id === p.padre);
  app.innerHTML = `
    <button class="volver" id="volver">‹ ${padre ? "Volver a " + limpiar(padre.nombre) : "Volver al menú"}</button>
    <h2>${limpiar(p.nombre)}</h2><p class="sub">${limpiar(p.resumen)}</p>
    ${hijos.length ? `<h3>Subprocesos</h3><div class="lista" id="hijos">${hijos.map(h => `<button class="proceso" data-id="${limpiar(h.id)}"><strong>${limpiar(h.nombre)}</strong><span>${limpiar(h.resumen)}</span></button>`).join("")}</div>` : ""}
    <ol class="pasos">${p.pasos.map(pintarPaso).join("")}</ol>`;
  document.getElementById("volver").onclick = () => { location.hash = padre ? padre.id : ""; };
  const caja = document.getElementById("hijos");
  if (caja) caja.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) location.hash = b.dataset.id; });
  window.scrollTo(0, 0);
}
function poner(banner) {
  document.getElementById("banner")?.remove();
  if (banner) document.body.insertBefore(banner, document.body.firstChild);
}
function navegar() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "editor") { poner(null); return pintarEditor(); }
  app.className = ""; derivar(verBorrador ? D : PUB);
  if (verBorrador) {
    const b = document.createElement("div"); b.id = "banner"; b.className = "banner";
    b.innerHTML = 'Vista previa del BORRADOR (no publicado) <button id="volEd">Volver al editor</button>';
    poner(b); b.querySelector("button").onclick = () => { verBorrador = false; location.hash = "editor"; };
  } else poner(null);
  const p = PROCESOS.find(x => x.id === id);
  p ? verProceso(p) : verMenu();
}

/* ================= EDITOR ================= */
let pestana = "procesos", selProceso = null, selBloque = null;
let mensajes = {};

function h(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag); let valor;
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "value") valor = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  hijos.flat(Infinity).forEach(x => { if (x == null || x === false) return; e.append(x.nodeType ? x : document.createTextNode(x)); });
  if (valor !== undefined) e.value = valor;
  return e;
}
const paramsDe = b => [...new Set(((b?.titulo || "") + " " + (b?.texto || "")).match(/\{(\w+)\}/g)?.map(x => x.slice(1, -1)) || [])];
const usosBloque = id => D.procesos.reduce((n, p) => n + p.pasos.filter(s => s.bloque === id).length, 0);
const ID_OK = /^[A-Za-z0-9][A-Za-z0-9_-]*$/;
function marcarSucio() { guardarBorrador(); actualizarBarra(); }
function mover(lista, i, d) { const j = i + d; if (j < 0 || j >= lista.length) return; [lista[i], lista[j]] = [lista[j], lista[i]]; marcarSucio(); }

/* Validación de enlaces y datos (igual que en el servidor del módulo admin) */
function validar(d) {
  const errores = [], avisos = [], idsB = new Set(), idsP = new Set();
  d.bloques.forEach((b, i) => {
    const et = `Bloque ${i + 1}${b.id ? " (" + b.id + ")" : ""}`;
    if (!b.id || !ID_OK.test(b.id)) errores.push(`${et}: el identificador debe usar solo letras sin tildes, números, guiones o guion bajo.`);
    else if (idsB.has(b.id)) errores.push(`${et}: identificador repetido.`);
    idsB.add(b.id);
    if (!String(b.titulo || "").trim()) errores.push(`${et}: falta el título.`);
    if (!String(b.texto || "").trim()) errores.push(`${et}: falta el texto.`);
  });
  d.procesos.forEach((p, i) => {
    const et = `Proceso ${i + 1}${p.id ? " (" + p.id + ")" : ""}`;
    if (!p.id || !ID_OK.test(p.id)) errores.push(`${et}: el identificador debe usar solo letras sin tildes, números, guiones o guion bajo.`);
    else if (idsP.has(p.id)) errores.push(`${et}: identificador repetido.`);
    idsP.add(p.id);
    if (!String(p.nombre || "").trim()) errores.push(`${et}: falta el nombre.`);
    if (!p.pasos.length) avisos.push(`${et}: no tiene pasos.`);
    p.pasos.forEach((s, j) => {
      const ep = `${et}, paso ${j + 1}`;
      if ("bloque" in s) {
        const b = d.bloques.find(x => x.id === s.bloque);
        if (!b) errores.push(`${ep}: usa el bloque "${s.bloque}" que no existe.`);
        else paramsDe(b).forEach(n => { if (!(s.params || []).some(x => x.nombre === n)) avisos.push(`${ep}: el bloque "${s.bloque}" necesita el valor de {${n}}.`); });
      } else if (!String(s.titulo || "").trim()) errores.push(`${ep}: falta el título.`);
    });
  });
  d.procesos.forEach(p => {
    if (p.padre && !idsP.has(p.padre)) errores.push(`Proceso "${p.id}": su proceso padre "${p.padre}" no existe.`);
    if (p.padre === p.id) errores.push(`Proceso "${p.id}": no puede ser padre de sí mismo.`);
  });
  return { errores, avisos };
}
function descargar(nombre, objeto) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(objeto, null, 2)], { type: "application/json" }));
  a.download = nombre; document.body.append(a); a.click(); a.remove();
}

function pintarEditor() {
  const cuerpo = h("div", {});
  const tabs = h("div", { class: "tabs" }, [["procesos", "Procesos"], ["bloques", "Pasos comunes (bloques)"], ["ayuda", "Cómo publicar"]]
    .map(([k, t]) => h("button", { class: pestana === k ? "activa" : "", onclick: () => { pestana = k; mensajes = {}; pintarEditor(); } }, t)));
  app.className = "ed";
  app.replaceChildren(
    h("div", { class: "fila", style: "margin-bottom:10px" },
      h("button", { class: "b", onclick: () => { app.className = ""; location.hash = ""; } }, "‹ Salir del modo editor"),
      h("h2", { class: "crece", style: "margin:0" }, "Modo editor")),
    tabs, cuerpo, h("div", { class: "barra", id: "barra" }));
  cuerpo.append(...cajas());
  ({ procesos: vistaProcesos, bloques: vistaBloques, ayuda: vistaAyuda })[pestana](cuerpo);
  actualizarBarra();
  window.scrollTo(0, 0);
}
function cajas() {
  const l = [];
  if (mensajes.ok) l.push(h("div", { class: "caja-ok" }, mensajes.ok));
  if (mensajes.err) l.push(h("div", { class: "caja-err" }, h("strong", {}, mensajes.err.titulo), h("ul", {}, mensajes.err.lista.map(x => h("li", {}, x)))));
  if (mensajes.av?.length) l.push(h("div", { class: "caja-av" }, h("strong", {}, "Avisos (revísalos, no impiden publicar):"), h("ul", {}, mensajes.av.map(x => h("li", {}, x)))));
  return l;
}
function actualizarBarra() {
  const b = document.getElementById("barra"); if (!b) return;
  const cambios = hayCambios();
  b.replaceChildren(
    h("span", { class: "estado" + (cambios ? " sucio" : "") }, cambios ? "● Borrador con cambios sin publicar" : "✓ Sin cambios"),
    h("button", { class: "b", onclick: () => { const v = validar(D); mensajes = v.errores.length ? { err: { titulo: "Hay errores que corregir:", lista: v.errores }, av: v.avisos } : { ok: "No se encontraron errores.", av: v.avisos }; pintarEditor(); } }, "Revisar errores"),
    h("button", { class: "b", onclick: () => { verBorrador = true; location.hash = ""; navegar(); } }, "Ver cómo queda"),
    h("button", { class: "b pri", disabled: !cambios, onclick: publicar }, "Descargar archivos"),
    h("button", { class: "b pel", disabled: !cambios, onclick: () => { if (confirm("¿Descartar todo el borrador y volver a lo publicado?")) { D = clonar(PUB); borrarBorrador(); selProceso = selBloque = null; mensajes = { ok: "Borrador descartado." }; pintarEditor(); } } }, "Descartar borrador"));
}
function publicar() {
  const v = validar(D);
  if (v.errores.length) { mensajes = { err: { titulo: "No se puede publicar todavía. Corrige esto:", lista: v.errores }, av: v.avisos }; pintarEditor(); return; }
  descargar("bloques.json", { bloques: D.bloques });
  setTimeout(() => descargar("procesos.json", { procesos: D.procesos }), 400);
  pestana = "ayuda"; mensajes = { ok: "Se descargaron bloques.json y procesos.json. Ahora súbelos a la carpeta datos/ (pasos abajo).", av: v.avisos }; pintarEditor();
}
function vistaAyuda(el) {
  el.append(h("div", { class: "tarjeta" },
    h("h3", { style: "margin-top:0" }, "Cómo publicar los cambios"),
    h("ol", {},
      h("li", {}, "Pulsa ", h("strong", {}, "Revisar errores"), " y corrige lo que aparezca."),
      h("li", {}, "Pulsa ", h("strong", {}, "Ver cómo queda"), " para comprobar el manual con tus cambios."),
      h("li", {}, "Pulsa ", h("strong", {}, "Descargar archivos"), ": se bajan ", h("code", {}, "bloques.json"), " y ", h("code", {}, "procesos.json"), "."),
      h("li", {}, "En el repositorio, entra a la carpeta ", h("code", {}, "datos"), ", elige ", h("strong", {}, "Add file → Upload files"), ", sube los dos archivos (reemplazan a los anteriores) y confirma con ", h("strong", {}, "Commit changes"), "."),
      h("li", {}, "Si agregaste imágenes nuevas, súbelas a la carpeta ", h("code", {}, "img"), " con el mismo nombre que escribiste en el paso."),
      h("li", {}, "Espera 1 o 2 minutos y recarga el manual: los cambios ya los ve todo el mundo.")),
    h("p", { class: "nota" }, "Tu borrador se guarda solo en este navegador de este computador. Si cambias de computador antes de publicar, no estará. Una vez publicado, pulsa Descartar borrador o recarga para trabajar sobre lo nuevo.")));
}

/* ----- imagen: ruta escrita (las imágenes se suben a la carpeta img del repositorio) ----- */
function controlImagen(obj) {
  return h("div", {}, h("label", {}, "Imagen (opcional)"),
    h("input", { value: obj.imagen || "", placeholder: "Ejemplo: img/paso-sipec.png", oninput: e => { const v = e.target.value.trim(); if (v) obj.imagen = v; else delete obj.imagen; marcarSucio(); } }),
    h("p", { class: "nota" }, "Escribe la ruta de la imagen. Primero súbela a la carpeta ", h("code", {}, "img"), " del repositorio (ver pestaña Cómo publicar)."));
}

/* ----- PROCESOS ----- */
function vistaProcesos(el) {
  if (selProceso) { const p = D.procesos.find(x => x.id === selProceso); if (p) return editorProceso(el, p); selProceso = null; }
  el.append(h("div", { class: "fila", style: "margin-bottom:12px" }, h("h3", { class: "crece", style: "margin:0" }, "Procesos"),
    h("button", { class: "b pri", onclick: () => {
      let n = 1; while (D.procesos.some(p => p.id === "nuevo-proceso-" + n)) n++;
      D.procesos.push({ id: "nuevo-proceso-" + n, nombre: "Nuevo proceso", resumen: "", pasos: [] }); selProceso = "nuevo-proceso-" + n; marcarSucio(); pintarEditor();
    } }, "+ Nuevo proceso")));
  const filas = [];
  D.procesos.filter(p => !p.padre).forEach(p => { filas.push(p); D.procesos.filter(x => x.padre === p.id).forEach(x => filas.push(x)); });
  D.procesos.filter(p => p.padre && !D.procesos.some(x => x.id === p.padre)).forEach(p => filas.push(p));
  const hermano = (p, dir) => { const i = D.procesos.indexOf(p), r = dir < 0 ? D.procesos.slice(0, i).map((x, k) => [x, k]).reverse() : D.procesos.map((x, k) => [x, k]).slice(i + 1);
    return r.find(([x]) => x.padre === p.padre); };
  filas.forEach(p => el.append(h("div", { class: "item" + (p.padre ? " hijo" : "") },
    h("div", { class: "txt", onclick: () => { selProceso = p.id; pintarEditor(); } },
      h("strong", {}, p.nombre, " ", p.padre ? h("span", { class: "etq" }, "subproceso") : null), h("span", {}, `${p.pasos.length} pasos · ${p.resumen || "sin resumen"}`)),
    h("button", { class: "b mini", disabled: !hermano(p, -1), onclick: () => { const s = hermano(p, -1); mover(D.procesos, D.procesos.indexOf(p), s[1] - D.procesos.indexOf(p)); pintarEditor(); } }, "↑"),
    h("button", { class: "b mini", disabled: !hermano(p, 1), onclick: () => { const s = hermano(p, 1); mover(D.procesos, D.procesos.indexOf(p), s[1] - D.procesos.indexOf(p)); pintarEditor(); } }, "↓"))));
}
function editorProceso(el, p) {
  const hijos = D.procesos.filter(x => x.padre === p.id);
  el.append(h("button", { class: "b", onclick: () => { selProceso = null; pintarEditor(); } }, "‹ Volver a la lista"));
  const opcionesPadre = D.procesos.filter(x => x !== p && !x.padre && !hijos.includes(x));
  el.append(h("div", { class: "tarjeta", style: "margin-top:12px" },
    h("label", {}, "Nombre del proceso"), h("input", { value: p.nombre, oninput: e => { p.nombre = e.target.value; marcarSucio(); } }),
    h("label", {}, "Resumen (se ve en el menú)"), h("input", { value: p.resumen || "", oninput: e => { p.resumen = e.target.value; marcarSucio(); } }),
    h("label", {}, "¿Es subproceso de otro proceso?"),
    h("select", { value: p.padre || "", onchange: e => { if (e.target.value) p.padre = e.target.value; else delete p.padre; marcarSucio(); } },
      h("option", { value: "" }, "No, es un proceso principal"), opcionesPadre.map(x => h("option", { value: x.id }, "Sí, de: " + x.nombre))),
    hijos.length ? h("p", { class: "nota" }, "Tiene subprocesos, por eso no puede ser subproceso de otro.") : null,
    h("label", {}, "Identificador (parte de la dirección del proceso)"),
    h("input", { value: p.id, onchange: e => {
      const n = e.target.value.trim();
      if (!ID_OK.test(n)) { alert("Usa solo letras sin tildes ni espacios, números, guiones o guion bajo."); e.target.value = p.id; return; }
      if (D.procesos.some(x => x !== p && x.id === n)) { alert("Ya existe un proceso con ese identificador."); e.target.value = p.id; return; }
      D.procesos.forEach(x => { if (x.padre === p.id) x.padre = n; }); p.id = n; selProceso = n; marcarSucio();
    } }),
    h("p", { class: "nota" }, "Si lo cambias, los enlaces antiguos a este proceso dejan de funcionar.")));
  el.append(h("h3", {}, "Pasos"));
  p.pasos.forEach((s, i) => el.append(tarjetaPaso(p, s, i)));
  el.append(h("div", { class: "fila" },
    h("button", { class: "b pri", onclick: () => { p.pasos.push({ titulo: "", texto: "" }); marcarSucio(); pintarEditor(); } }, "+ Paso propio"),
    h("button", { class: "b", onclick: () => { p.pasos.push({ bloque: D.bloques[0]?.id || "", params: [] }); marcarSucio(); pintarEditor(); } }, "+ Paso común (bloque)")),
    h("hr", { style: "margin:26px 0 14px;border:0;border-top:1px solid var(--linea)" }),
    h("button", { class: "b pel", onclick: () => {
      if (hijos.length) return alert("Primero elimina o mueve sus subprocesos: " + hijos.map(x => x.nombre).join(", "));
      if (!confirm(`¿Eliminar el proceso "${p.nombre}"?`)) return;
      D.procesos.splice(D.procesos.indexOf(p), 1); selProceso = null; marcarSucio(); pintarEditor();
    } }, "Eliminar este proceso"));
}
function tarjetaPaso(p, s, i) {
  const esBloque = "bloque" in s;
  const caja = h("div", { class: "tarjeta paso" + (esBloque ? " esbloque" : "") },
    h("div", { class: "fila" }, h("span", { class: "num" }, "Paso " + (i + 1)), esBloque ? h("span", { class: "etq r" }, "paso común") : h("span", { class: "etq" }, "paso propio"), h("span", { class: "crece" }),
      h("button", { class: "b mini", disabled: i === 0, onclick: () => { mover(p.pasos, i, -1); pintarEditor(); } }, "↑"),
      h("button", { class: "b mini", disabled: i === p.pasos.length - 1, onclick: () => { mover(p.pasos, i, 1); pintarEditor(); } }, "↓"),
      h("button", { class: "b mini pel", onclick: () => { if (!confirm("¿Eliminar este paso?")) return; p.pasos.splice(i, 1); marcarSucio(); pintarEditor(); } }, "Eliminar")));
  if (!esBloque) {
    const ta = h("textarea", { oninput: e => { s.texto = e.target.value; marcarSucio(); } }); ta.value = s.texto || "";
    caja.append(h("label", {}, "Título del paso"), h("input", { value: s.titulo || "", oninput: e => { s.titulo = e.target.value; marcarSucio(); } }),
      h("label", {}, "Instrucciones"), ta, h("p", { class: "nota" }, "Cada Enter es un salto de línea."), controlImagen(s),
      h("p", {}, h("button", { class: "b mini", onclick: () => {
        if (!confirm("¿Convertir en paso común? Se perderá el texto de este paso.")) return;
        const img = s.imagen; Object.keys(s).forEach(k => delete s[k]); s.bloque = D.bloques[0]?.id || ""; s.params = []; if (img) s.imagen = img; marcarSucio(); pintarEditor();
      } }, "Cambiar a paso común")));
  } else {
    const b = D.bloques.find(x => x.id === s.bloque);
    caja.append(h("label", {}, "Bloque a usar"),
      h("select", { value: s.bloque, onchange: e => { s.bloque = e.target.value; s.params = []; marcarSucio(); pintarEditor(); } },
        !b ? h("option", { value: s.bloque }, `(no existe: ${s.bloque})`) : null, D.bloques.map(x => h("option", { value: x.id }, x.titulo))));
    if (b) {
      caja.append(h("p", { class: "nota" }, "Texto del bloque: ", b.texto.slice(0, 160) + (b.texto.length > 160 ? "…" : "")));
      s.params = s.params || []; const nec = paramsDe(b);
      nec.forEach(n => caja.append(h("label", {}, "Valor para ", h("span", { class: "param" }, `{${n}}`)),
        h("input", { value: s.params.find(x => x.nombre === n)?.valor || "", oninput: e => {
          const f = s.params.find(x => x.nombre === n);
          if (e.target.value === "") s.params = s.params.filter(x => x.nombre !== n); else if (f) f.valor = e.target.value; else s.params.push({ nombre: n, valor: e.target.value });
          marcarSucio();
        } })));
      if (!nec.length) caja.append(h("p", { class: "nota" }, "Este bloque no tiene valores variables."));
    }
    caja.append(controlImagen(s), h("p", {}, h("button", { class: "b mini", onclick: () => {
      const b2 = D.bloques.find(x => x.id === s.bloque), rep = t => t.replace(/\{(\w+)\}/g, (_, n) => s.params.find(x => x.nombre === n)?.valor ?? `{${n}}`);
      const img = s.imagen, titulo = b2 ? rep(b2.titulo) : "", texto = b2 ? rep(b2.texto) : "";
      Object.keys(s).forEach(k => delete s[k]); s.titulo = titulo; s.texto = texto; if (img) s.imagen = img; marcarSucio(); pintarEditor();
    } }, "Convertir en paso propio (copia el texto)")));
  }
  return caja;
}

/* ----- BLOQUES ----- */
function vistaBloques(el) {
  if (selBloque) { const b = D.bloques.find(x => x.id === selBloque); if (b) return editorBloque(el, b); selBloque = null; }
  el.append(h("div", { class: "fila", style: "margin-bottom:6px" }, h("h3", { class: "crece", style: "margin:0" }, "Pasos comunes (bloques)"),
    h("button", { class: "b pri", onclick: () => {
      let n = 1; while (D.bloques.some(b => b.id === "nuevo-bloque-" + n)) n++;
      D.bloques.push({ id: "nuevo-bloque-" + n, titulo: "Nuevo paso común", texto: "" }); selBloque = "nuevo-bloque-" + n; marcarSucio(); pintarEditor();
    } }, "+ Nuevo bloque")),
    h("p", { class: "nota" }, "Un bloque es un paso que se repite en varios procesos. Si lo cambias aquí, cambia en todos los que lo usan."));
  D.bloques.forEach((b, i) => el.append(h("div", { class: "item" },
    h("div", { class: "txt", onclick: () => { selBloque = b.id; pintarEditor(); } }, h("strong", {}, b.titulo), h("span", {}, `Usado ${usosBloque(b.id)} veces · ${b.id}`)),
    h("button", { class: "b mini", disabled: i === 0, onclick: () => { mover(D.bloques, i, -1); pintarEditor(); } }, "↑"),
    h("button", { class: "b mini", disabled: i === D.bloques.length - 1, onclick: () => { mover(D.bloques, i, 1); pintarEditor(); } }, "↓"))));
}
function editorBloque(el, b) {
  const usos = D.procesos.filter(p => p.pasos.some(s => s.bloque === b.id));
  const ta = h("textarea", { oninput: e => { b.texto = e.target.value; marcarSucio(); } }); ta.value = b.texto || "";
  el.append(h("button", { class: "b", onclick: () => { selBloque = null; pintarEditor(); } }, "‹ Volver a la lista"),
    h("div", { class: "tarjeta", style: "margin-top:12px" },
      h("label", {}, "Título del paso"), h("input", { value: b.titulo, oninput: e => { b.titulo = e.target.value; marcarSucio(); } }),
      h("label", {}, "Instrucciones"), ta,
      h("p", { class: "nota" }, "Para valores que cambian en cada proceso escribe el nombre entre llaves, por ejemplo ", h("code", {}, "{archivo}"), ". Cada proceso que use el bloque indicará el valor."),
      controlImagen(b), h("label", {}, "Identificador"),
      h("input", { value: b.id, onchange: e => {
        const n = e.target.value.trim();
        if (!ID_OK.test(n)) { alert("Usa solo letras sin tildes ni espacios, números, guiones o guion bajo."); e.target.value = b.id; return; }
        if (D.bloques.some(x => x !== b && x.id === n)) { alert("Ya existe un bloque con ese identificador."); e.target.value = b.id; return; }
        D.procesos.forEach(p => p.pasos.forEach(s => { if (s.bloque === b.id) s.bloque = n; })); b.id = n; selBloque = n; marcarSucio();
      } }),
      h("p", { class: "nota" }, "Si lo cambias, se actualizan solos los procesos que lo usan.")),
    h("h3", {}, "Procesos que usan este bloque"), usos.length ? h("ul", {}, usos.map(p => h("li", {}, p.nombre))) : h("p", { class: "nota" }, "Ninguno todavía."),
    h("hr", { style: "margin:26px 0 14px;border:0;border-top:1px solid var(--linea)" }),
    h("button", { class: "b pel", onclick: () => {
      if (usos.length) return alert("No se puede eliminar: lo usan " + usos.map(p => p.nombre).join(", ") + ". Primero quítalo de ellos.");
      if (!confirm("¿Eliminar este bloque?")) return;
      D.bloques.splice(D.bloques.indexOf(b), 1); selBloque = null; marcarSucio(); pintarEditor();
    } }, "Eliminar este bloque"));
}

/* ================= ARRANQUE ================= */
const cargar = url => fetch(url, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(url); return r.json(); });
Promise.all([cargar("datos/bloques.json"), cargar("datos/procesos.json")])
  .then(([b, p]) => {
    PUB = { bloques: b.bloques, procesos: p.procesos };
    const guardado = leerBorrador();
    D = guardado && guardado.bloques && guardado.procesos ? guardado : clonar(PUB);
    window.addEventListener("hashchange", navegar);
    navegar();
  })
  .catch(() => { app.innerHTML = '<h1>No se pudo cargar el manual</h1><p class="sub">Faltan los archivos datos/bloques.json o datos/procesos.json. Avisa al responsable del manual.</p>'; });
</script>
